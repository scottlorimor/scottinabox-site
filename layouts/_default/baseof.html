<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  {{ partial "analytics.html" . }}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 2rem;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      font-weight: 300;
      color: #FCFCFC;
      background-color: #2c2c2a;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      line-height: 1.8;
    }
    main {
      max-width: 36rem;
      text-align: right;
      margin-right: 350px;
      margin-bottom: 200px;
    }
h1, h2, h3, h4, h5, h6 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
    }
    h1 {
      font-weight: 400;
      font-size: 1.5em;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2em;
    }
    h2 {
      font-size: 1em;
      letter-spacing: 3px;
      margin-top: 2em;
      color: #808080;
    }
    p {
      line-height: 1.8em;
      margin-top: 1em;
      margin-bottom: 1.5em;
    }
    a {
      text-decoration: none;
      color: #b5c9a9;
      border-bottom: 1px solid #b5c9a9;
      padding-bottom: 2px;
    }
    a:hover {
      color: #e2eccd;
      border-bottom-color: #e2eccd;
    }
    ::selection {
      background-color: #5c7a8a;
      color: #FFFFFF;
    }
    .muted {
      color: #808080;
      border-color: #5c7a8a;
    }
    .muted a {
      color: #808080;
    }
    h2 a {
      border-bottom: none;
    }
    .icon {
      display: inline-block;
      width: 1.66em;
      height: 1.66em;
      vertical-align: -0.22em;
      margin-right: 0.41em;
      color: #a8a8a8;
    }
    footer {
      margin-top: 4em;
      font-size: 0.9em;
      color: #808080;
    }
    footer a {
      color: #808080;
    }
    .content-page {
      align-self: center;
      text-align: left;
      max-width: 40rem;
      width: 100%;
      margin: 4rem auto;
      padding-top: 2rem;
    }
  @media (max-width: 768px) {
      body {
        padding: 1.5rem;
        justify-content: flex-end;
      }
      main {
        max-width: 100%;
        margin-right: 0;
        margin-bottom: 2rem;
      }
      .content-page {
        margin: 1.5rem 0;
      }
    }
  </style>
</head>
<body>
  <main{{ if not .IsHome }} class="content-page"{{ end }}>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
