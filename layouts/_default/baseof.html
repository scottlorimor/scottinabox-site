<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 2rem;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      color: #FCFCFC;
      background-color: #1a1a1a;
      line-height: 1.8;
    }
    main {
      max-width: 36rem;
      text-align: right;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
    }
    h1 {
      font-weight: 700;
      font-size: 1.5em;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2em;
    }
    h2 {
      text-transform: uppercase;
      font-size: 1em;
      letter-spacing: 3px;
      margin-top: 2em;
      color: #808080;
    }
    p {
      line-height: 1.8em;
      margin-top: 1em;
      margin-bottom: 1.5em;
    }
    a {
      text-decoration: none;
      color: #FCFCFC;
      border-bottom: 1px solid #5c7a8a;
      padding-bottom: 2px;
    }
    a:hover {
      color: #fffe9a;
    }
    ::selection {
      background-color: #5c7a8a;
      color: #FFFFFF;
    }
    .muted {
      color: #808080;
      border-color: #5c7a8a;
    }
    .muted a {
      color: #808080;
    }
    .interests {
      display: inline;
      list-style: none;
    }
    .interests li {
      display: inline;
    }
    .interests li::after {
      content: ', ';
    }
    .interests li:last-child::after {
      content: '';
    }
    footer {
      margin-top: 4em;
      font-size: 0.9em;
      color: #808080;
    }
    footer a {
      color: #808080;
    }
  </style>
</head>
<body>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
