{{ define "main" }}
<h1>{{ .Title }}</h1>

{{ if in .RelPermalink "/posts/" }}
<p class="muted" style="font-size: 0.85em;">{{ .Date.Format "2006-01-02" }}</p>
{{ end }}

<div style="margin-top: 2em;">
  {{ .Content }}
</div>

<p style="margin-top: 3em;">
{{ if in .RelPermalink "/posts/" }}
<a href="/posts/">Back to Thinking</a>
{{ else }}
<a href="/">Home</a>
{{ end }}
</p>
{{ end }}
